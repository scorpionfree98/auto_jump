name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Do not cancel an earlier main push: every successful push needs its own release.
  group: android-build-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Allocate reproducible release version
        id: version
        run: |
          version="0.3.$GITHUB_RUN_NUMBER"
          code=$((1000 + GITHUB_RUN_NUMBER))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_toolkitVersionName=$version" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_toolkitVersionCode=$code" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and build pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Test and build trusted revision
        if: github.event_name != 'pull_request'
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: |
          if [[ -z "$AMAP_API_KEY" || "$AMAP_API_KEY" == 'CONFIGURE_AMAP_KEY' ]]; then
            echo "Configure the AMAP_API_KEY repository secret before building a distributable APK." >&2
            exit 1
          fi
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease "-PAMAP_API_KEY=$AMAP_API_KEY" --no-daemon

      - name: Verify AMap key in compiled APKs
        if: github.event_name != 'pull_request'
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          key = os.environ['AMAP_API_KEY']
          aapt = os.path.join(os.environ['ANDROID_HOME'], 'build-tools', '35.0.0', 'aapt')
          apks = glob.glob('app/build/outputs/apk/*/*.apk')
          if not apks:
              raise SystemExit('No APKs found for AMap configuration verification')
          for apk in apks:
              result = subprocess.run([aapt, 'dump', 'xmltree', apk, 'AndroidManifest.xml'],
                                      capture_output=True, text=True)
              if result.returncode or 'com.amap.api.v2.apikey' not in result.stdout or key not in result.stdout:
                  raise SystemExit('Compiled APK AMap configuration check failed')
              badging = subprocess.run([aapt, 'dump', 'badging', apk], capture_output=True, text=True)
              expected_code = os.environ['ORG_GRADLE_PROJECT_toolkitVersionCode']
              expected_name = os.environ['ORG_GRADLE_PROJECT_toolkitVersionName']
              if badging.returncode or f"versionCode='{expected_code}'" not in badging.stdout or f"versionName='{expected_name}'" not in badging.stdout:
                  raise SystemExit('Compiled APK version does not match release version')
          print('AMap key injection verified in all compiled APKs; key value omitted.')
          PY

      # Signing secrets are never exposed to pull-request code. Gradle first produces an
      # unsigned release; apksigner receives credentials only after the build has finished.
      - name: Sign release APK when secrets are configured
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          values=("$RELEASE_KEYSTORE_BASE64" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD")
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -eq 0 ]]; then
            if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
              echo "Main releases require all four signing secrets." >&2
              exit 1
            fi
            echo "Signing secrets are not configured; keeping the unsigned release APK."
            exit 0
          fi
          if [[ "$configured" -ne 4 ]]; then
            echo "Signing secrets are incomplete; configure all four ANDROID_RELEASE_* secrets." >&2
            exit 1
          fi

          unsigned_apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*-unsigned.apk' -print -quit)"
          if [[ -z "$unsigned_apk" ]]; then
            echo "Unsigned release APK was not produced." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/toolkit-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out app/build/outputs/apk/release/toolkit-release-signed.apk \
            "$unsigned_apk"
          "$apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/toolkit-release-signed.apk
          rm -f "$keystore"

      - name: Create checksums
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print0 \
            | sort -z \
            | xargs -0 sha256sum > app/build/outputs/apk/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: toolkit-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: Publish signed main release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      VERSION_CODE: ${{ needs.build.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: Download tested build
        run: gh run download "$GITHUB_RUN_ID" --name "toolkit-apks-$GITHUB_RUN_NUMBER" --dir tested-apks

      - name: Prepare public release assets
        run: |
          mkdir -p release-assets
          signed_apk="tested-apks/release/toolkit-release-signed.apk"
          test -s "$signed_apk"
          cp "$signed_apk" "release-assets/toolkit-$VERSION.apk"
          (cd release-assets && sha256sum "toolkit-$VERSION.apk" > SHA256SUMS.txt)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('release-assets/build-info.json').write_text(json.dumps({
              'versionName': os.environ['VERSION'],
              'versionCode': int(os.environ['VERSION_CODE']),
              'commit': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
          }, indent=2) + '\n')
          PY

      - name: Publish once and keep latest tied to current main
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
            echo "Release already exists for this run; preserving its assets."
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" --title "工具合集 $VERSION" \
              --generate-notes --latest=false
          fi
          current_main="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            gh release edit "$tag" --latest
          fi
