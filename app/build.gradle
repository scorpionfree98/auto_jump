plugins { id 'com.android.application' }
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) localPropertiesFile.withInputStream { localProperties.load(it) }
def amapApiKey = project.findProperty('AMAP_API_KEY') ?: localProperties.getProperty('AMAP_API_KEY') ?: 'CONFIGURE_AMAP_KEY'
def toolkitVersionCode = (project.findProperty('toolkitVersionCode') ?: '5').toInteger()
def toolkitVersionName = project.findProperty('toolkitVersionName') ?: '0.2.3'
def releaseSigningFile = rootProject.file('signing/release-key.properties')
def releaseSigningValues = new Properties()
if (releaseSigningFile.exists()) releaseSigningFile.withInputStream { releaseSigningValues.load(it) }
def queueRuntimeOnly = project.findProperty('queueRuntimeOnly') == 'true'
if (queueRuntimeOnly && !gradle.startParameter.taskNames.every {
    it == ':app:assembleDebug' || it == ':app:assembleDebugAndroidTest'
}) {
    throw new GradleException('queueRuntimeOnly is restricted to explicit debug runtime-test APK builds')
}
android {
    namespace 'cn.local.jiojio'
    compileSdk 35
    defaultConfig {
        manifestPlaceholders = [AMAP_API_KEY: amapApiKey]
        applicationId queueRuntimeOnly ? 'cn.local.toolkit.runtime' : 'cn.local.toolkit'
        minSdk 26
        targetSdk 35
        versionCode = toolkitVersionCode
        versionName = toolkitVersionName
        testInstrumentationRunner project.findProperty('runtimeTestRunner') ?: 'cn.local.jiojio.CoreRuntimeInstrumentation'
    }
    if (releaseSigningFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file("signing/${releaseSigningValues['storeFile']}")
                storePassword releaseSigningValues['storePassword']
                keyAlias releaseSigningValues['keyAlias']
                keyPassword releaseSigningValues['keyPassword']
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures { buildConfig true; aidl true }
    // Queue tests do not load maps. Omit ARM-only map natives solely for the
    // explicitly isolated x86 emulator debug build; release builds are forbidden.
    if (queueRuntimeOnly) packaging { jniLibs { excludes += ['**/*.so'] } }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningFile.exists()) signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.amap.api:3dmap-location-search:11.3.100_loc11.3.000_sea9.8.1'
    def shizukuVersion = '12.2.0'
    implementation "dev.rikka.shizuku:api:$shizukuVersion"
    implementation "dev.rikka.shizuku:provider:$shizukuVersion"
    testImplementation 'junit:junit:4.13.2'
}
